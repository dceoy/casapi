---
name: CodeQL
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '**/*.py'
      - '**/*.pyi'
      - '**/pyproject.toml'
      - '**/uv.lock'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '**/*.py'
      - '**/*.pyi'
      - '**/pyproject.toml'
      - '**/uv.lock'
permissions:
  contents: read
jobs:
  github-codeql-analysis:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: dceoy/gha-for-devops/.github/workflows/github-codeql-analysis.yml@593cca8cdc86cc7c579d8bbf48f2d8b223b71121
    with:
      language: >
        ["actions","python"]
