---
name: Claude Code review
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - ready_for_review
    paths-ignore:
      - .github/workflows/claude.yml
permissions:
  contents: read
jobs:
  check-review-credentials:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether Claude review is configured
        id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -n "${CLAUDE_CODE_OAUTH_TOKEN}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          fi
  claude-code-review:
    needs:
      - check-review-credentials
    if: >
      needs.check-review-credentials.outputs.configured == 'true'
      && (! github.event.pull_request.draft)
      && github.event.pull_request.user.type != 'Bot'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: dceoy/pr-loop/.github/workflows/claude-code-review.yml@da08f779b6daabe2f03124e392dbebca14792929
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # zizmor: ignore[secrets-outside-env]
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
