[project]
name = "claude-agent-api"
version = "0.1.0"
description = "Stateless HTTP API for remote Claude Code execution powered by Claude Agent SDK"
authors = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
maintainers = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[project.urls]
Repository = "https://github.com/dceoy/claude-agent-api"

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pyright>=1.1.407",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.17.1",
]

[tool.uv]
exclude-newer = "1 day"

[tool.hatch.build.targets.sdist]
only-include = ["claude_agent_api"]

[tool.hatch.build.targets.wheel]
packages = ["claude_agent_api"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
exclude = ["build", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = ["--cov=claude_agent_api", "--cov-branch"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["claude_agent_api"]
omit = ["**/__init__.py", "tests/**"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
