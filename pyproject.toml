[project]
name = "casapi"
version = "0.1.0"
description = "Stateless HTTP API for remote Claude Code execution powered by Claude Agent SDK"
authors = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
maintainers = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">= 3.11, < 3.15"
dependencies = [
  "claude-agent-sdk >= 0.2.0",
  "fastapi >= 0.115.0",
  "uvicorn[standard]>=0.54.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.urls]
Repository = "https://github.com/dceoy/casapi.git"

[tool.uv]
exclude-newer = "1 day"

[dependency-groups]
dev = [
  "httpx >= 0.27.0",
  "ruff >= 0.17.1",
  "pyright >= 1.1.407",
  "pytest >= 8.0.0",
  "pytest-asyncio >= 0.25.2",
  "pytest-mock >= 3.12.0",
  "pytest-cov >= 5.0.0",
  "mkdocs >= 1.6.1",
  "mkdocs-material >= 9.6.15",
  "mkdocstrings[python]>=1.0.8",
]

[tool.hatch.build.targets.sdist]
only-include = ["casapi", "LICENSE", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["casapi"]

[tool.ruff]
line-length = 88
exclude = ["build", ".venv"]
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY",  # flake8-copyright (CPY)
  "RET",  # flake8-return (RET)
  "missing-trailing-comma",   # missing-trailing-comma
  "boolean-type-hint-positional-argument",   # boolean-type-hint-positional-argument
  "boolean-default-value-positional-argument",   # boolean-default-value-positional-argument
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "docstring-missing-returns",   # Missing return documentation
  "docstring-missing-exception",   # Raised exception missing from docstring
  "import-private-name",  # Private name import
  "too-many-public-methods",  # Too many public methods
  "magic-value-comparison",  # Magic value used in comparison
  "no-self-use",  # Method could be function/static/classmethod
  "assert",     # Use of assert (acceptable in tests)
  "hardcoded-password-func-arg",     # Possible hardcoded password
  "private-member-access",   # Private member accessed
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-public-methods = 40

[tool.pyright]
exclude = ["build", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = [
  "--cov=casapi",
  "--cov-branch",
  "--doctest-modules",
  "--capture=no",
]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "6.0"

[tool.coverage.run]
source = ["casapi"]
omit = [
  "**/__init__.py",
  "tests/**",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["if TYPE_CHECKING:"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
